name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # Trigger deployment when code hits main
  pull_request:
    branches: [ main ] # Trigger tests when PR is opened

# Grant permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout our code
      uses: actions/checkout@v4

    - name: Validate HTML Syntax
      run: |
        grep -q "</html>" index.html && echo "HTML structure looks good!" || exit 1

  deploy-to-pages:
    needs: test-and-lint # ONLY run deployment if the tests pass!
    if: github.ref == 'refs/heads/main' # Only deploy if code is merged into main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout our code
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # Upload our entire directory

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4